resolver: lts-24.45

packages:
  - apecs
  - apecs-physics
  - apecs-gloss
  - apecs-gloss-3d
  - apecs-box2d
  - apecs-box3d
  - apecs-stm
  - examples

allow-newer: true

extra-deps:
  - git: https://gitlab.com/dpwiz/box-nd
    commit: 60cb77b7c7a77fc157b9a42baef0f633f965383f
    subdirs:
      - Box2D
      - Box3D

nix:
  pure: false
  packages:
    - libGL
    - freeglut
    - mesa_glu
    - zlib

system-ghc: true
install-ghc: false
